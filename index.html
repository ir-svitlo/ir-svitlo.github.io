<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<base href="https://ir-svitlo.github.io/">
<title>Світло Кропивницький місто</title>
<style>
html, body {
  min-width: min-content;
}
.js-message_text {
  background-color: whitesmoke;
  border: 1px solid dimgray;
  border-radius: 0.5em;
  margin: 1em 0.5em 1.5em;
  padding: 1em;
  min-width: min-content;
}
table {
  border-collapse: collapse;
  text-align: center;
  white-space: nowrap;
  text-size-adjust: 140%;
}
td {
  border: 1px solid darkgray;
  height: 1.5lh;
  min-width: 1.5lh;
  padding: 0;
}
tr:first-child td {
  border-top: none;
  border-bottom: none;
  border-right: none;
  vertical-align: top;
  height: 1.25lh;
}
tr:first-child td:first-child {
  border-left: none;
}
td:first-child {
  padding: 0 0.25lh;
}
td span {
  margin-left: -100%;
  background-color: whitesmoke;
}
.light {
  background-color: #FF5;
}
.outage {
  background-color: #333;
}
.emoji {
  background-size: 100%;
  display: inline-block;
  text-indent: -10em;
  height: 1lh;
  width: 1lh;
  text-size-adjust: 300%;
}
</style>
</head>
<body>
<script>
for (const brand of (navigator.userAgentData?.brands || [])) {
  const b = brand.brand
  const v = parseInt(brand.version)
  switch (true) {
    case (b == "Chromium" && v < 109):
    case (b == "Google Chrome" && v < 138):
    case (b == "Samsung Internet" && v < 28):
      const msg = "Визначено застарілу версію браузера. Спробуйте оновити браузер або використайте останню версію Google Chrome"
      document.write(
        "<div class=\"js-message_text\"><b>"
        + msg.replace(/(?= )/, " ".repeat(Math.max(245 - msg.length, 0)))  // 245 chars to enable mobile scaling
        + "</b></div>"
      )
      throw 0
  }
}

const match_qdata = ln => ln.match(/^\s*Черга\s*([0-9.]+)\s*:\s*(.*)/)
const thead = () => {
  return "<table><tr><td></td><td><span>"
     + [...Array(24).keys()].join("</span></td><td><span>")
     + "</span></td><td><span>0</span></td></tr>"
}
onhashchange = () => { location.reload() }
(async () => {
  const queues = (location.hash == "#*" || location.hash.match(/[0-9.]+/g) || ["2.1", "6.1"])
  const res = await fetch("https://api.codetabs.com/v1/proxy/?quest=https://t.me/s/SvitloKropyvnytskyiMisto")
  const html = await res.text()
  const dom = new DOMParser().parseFromString(html, "text/html")
  const msgs = Array.from(dom.querySelectorAll(".js-message_text")).reverse()
  for (const m of msgs) {
    const div = document.createElement("div")
    div.classList.add("js-message_text")
    const lines = (m.innerHTML.split("<br>"))
    div.innerHTML = lines.map((ln, ln_num) => {
      const qdata = match_qdata(ln)
      if (qdata) {
        const [, q, data] = qdata
        if (queues === true || queues.includes(q)) {
          const hours = Array(24).fill("<td class=\"light\"></td>")
          const outgs = data.split(/\s*,\s*/)
          for (const o of outgs) {
            const [o1, o2] = o.split(/\s*-\s*/).map(n => parseInt(n))
            for (let i = o1, len = hours.length; i < o2 && i < len; i++)
              hours[i] = "<td class=\"outage\"></td>"
          }
          ln = "<tr><td>Черга " + q + "</td>" + hours.join("") + "</tr>"
        } else
          ln = ""
        return (
          (lines[ln_num-1] === undefined || !match_qdata(lines[ln_num-1]) ? thead() : "")
          + ln
          + (lines[ln_num+1] === undefined || !match_qdata(lines[ln_num+1]) ? "</table>" : "")
        )
      }
      return ln + "<br>"
    }).join("")
    document.body.appendChild(div)
  }
})()
</script>
